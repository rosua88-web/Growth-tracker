<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="성장 호르몬"/>
<title>성장 호르몬 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --blue: #185FA5;
    --blue-light: #E6F1FB;
    --blue-mid: #378ADD;
    --green: #1D9E75;
    --green-light: #E1F5EE;
    --coral: #D85A30;
    --coral-light: #FAECE7;
    --amber: #BA7517;
    --amber-light: #FAEEDA;
    --red: #A32D2D;
    --red-light: #FCEBEB;
    --gray-bg: #F5F5F7;
    --card-bg: #FFFFFF;
    --border: rgba(0,0,0,0.10);
    --text-primary: #1A1A1A;
    --text-secondary: #6E6E73;
    --text-tertiary: #AEAEB2;
    --radius-md: 10px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --font: 'Noto Sans KR', -apple-system, sans-serif;
    --nav-height: 72px;
    --header-height: 56px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --gray-bg: #1C1C1E;
      --card-bg: #2C2C2E;
      --border: rgba(255,255,255,0.10);
      --text-primary: #F5F5F7;
      --text-secondary: #AEAEB2;
      --text-tertiary: #636366;
      --blue-light: #0A2A4A;
      --green-light: #0A2A1E;
      --coral-light: #3A1A0E;
      --amber-light: #3A2A0A;
      --red-light: #3A1414;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font);
    background: var(--gray-bg);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* Header */
  .header {
    background: var(--card-bg);
    border-bottom: 0.5px solid var(--border);
    height: var(--header-height);
    display: flex; align-items: center; justify-content: center;
    padding: 0 16px;
    flex-shrink: 0;
    padding-top: env(safe-area-inset-top);
  }
  .header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }

  /* Scroll area */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px 16px;
    padding-bottom: calc(var(--nav-height) + 8px);
  }

  /* Bottom Nav */
  .nav {
    background: var(--card-bg);
    border-top: 0.5px solid var(--border);
    height: var(--nav-height);
    display: flex;
    flex-shrink: 0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1; border: none; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; font-size: 10px; font-family: var(--font); font-weight: 500;
    color: var(--text-tertiary); padding: 6px 4px;
    transition: color 0.15s;
  }
  .nav-btn svg { width: 24px; height: 24px; }
  .nav-btn.active { color: var(--blue); }

  /* Pages */
  .page { display: none; }
  .page.active { display: block; }

  /* Cards */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius-xl);
    border: 0.5px solid var(--border);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 12px; font-weight: 600; letter-spacing: 0.4px;
    color: var(--text-secondary); text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* Calendar */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-nav button {
    background: var(--gray-bg); border: none; border-radius: 50%;
    width: 32px; height: 32px; cursor: pointer; font-size: 16px;
    color: var(--text-secondary); display: flex; align-items: center; justify-content: center;
  }
  .cal-title { font-size: 17px; font-weight: 600; letter-spacing: -0.4px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
  .cal-dow { text-align: center; font-size: 11px; font-weight: 500; color: var(--text-secondary); padding: 4px 0 8px; }
  .cal-day {
    aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 10px; cursor: pointer; border: none; background: none;
    position: relative; gap: 2px;
  }
  .cal-day:active { background: var(--gray-bg); }
  .day-num { font-size: 14px; font-weight: 400; color: var(--text-primary); width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .cal-day.today .day-num { background: var(--blue); color: #fff; font-weight: 600; }
  .cal-day.other-month .day-num { color: var(--text-tertiary); }
  .cal-day.selected .day-num { outline: 2px solid var(--blue-mid); }
  .dot-row { display: flex; gap: 2px; justify-content: center; }
  .dot { width: 5px; height: 5px; border-radius: 50%; }
  .dot-inj { background: var(--blue); }
  .dot-rest { background: var(--amber); }
  .dot-hosp { background: var(--red); }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 0.5px solid var(--border); }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* Day detail */
  .sel-day-header { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .history-list { display: flex; flex-direction: column; gap: 6px; }
  .history-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--gray-bg); border-radius: var(--radius-md); font-size: 13px; }
  .history-badge { padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .badge-inj { background: var(--blue-light); color: var(--blue); }
  .badge-rest { background: var(--amber-light); color: var(--amber); }
  .badge-hosp { background: var(--red-light); color: var(--red); }
  .history-detail { color: var(--text-primary); flex: 1; }
  .empty-state { text-align: center; padding: 24px 0; color: var(--text-tertiary); font-size: 14px; }

  /* Inject page */
  .zone-grid { display: flex; justify-content: space-around; margin-bottom: 4px; }
  .zone-btn {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer; border: 2px solid transparent; background: none;
    padding: 10px 12px; border-radius: var(--radius-lg); transition: all 0.15s;
    font-family: var(--font);
  }
  .zone-btn:active { transform: scale(0.96); }
  .zone-btn span { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
  .zone-btn.selected { border-color: var(--blue); background: var(--blue-light); }
  .zone-btn.selected span { color: var(--blue); }

  .side-row { display: flex; gap: 8px; margin-top: 12px; }
  .side-btn {
    flex: 1; padding: 10px; font-size: 14px; font-family: var(--font); font-weight: 500;
    border: 0.5px solid var(--border); border-radius: var(--radius-md);
    background: var(--gray-bg); cursor: pointer; color: var(--text-secondary);
    transition: all 0.15s;
  }
  .side-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  .input-field {
    width: 100%; border: 0.5px solid var(--border); border-radius: var(--radius-md);
    padding: 12px 14px; font-size: 16px; font-family: var(--font);
    background: var(--gray-bg); color: var(--text-primary);
    -webkit-appearance: none;
  }
  .input-field:focus { outline: none; border-color: var(--blue-mid); background: var(--card-bg); }

  .dose-row { display: flex; align-items: center; gap: 10px; }
  .dose-row label { font-size: 14px; color: var(--text-secondary); white-space: nowrap; }
  .dose-input { flex: 1; border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; font-size: 16px; font-family: var(--font); background: var(--gray-bg); color: var(--text-primary); -webkit-appearance: none; }
  .dose-input:focus { outline: none; border-color: var(--blue-mid); }
  .dose-unit { font-size: 14px; color: var(--text-secondary); font-weight: 500; }

  .tag-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag-btn {
    padding: 9px 18px; border-radius: 22px; font-size: 14px; font-family: var(--font); font-weight: 500;
    border: 0.5px solid var(--border); background: var(--gray-bg); cursor: pointer; color: var(--text-secondary);
    transition: all 0.15s;
  }
  .tag-btn.active-rest { background: var(--amber-light); color: var(--amber); border-color: var(--amber); }
  .tag-btn.active-hosp { background: var(--red-light); color: var(--red); border-color: var(--red); }

  .save-btn {
    width: 100%; margin-top: 8px; padding: 16px; background: var(--blue); color: #fff;
    border: none; border-radius: var(--radius-xl); font-size: 16px; font-family: var(--font);
    font-weight: 600; cursor: pointer; letter-spacing: -0.2px; transition: opacity 0.15s;
  }
  .save-btn:active { opacity: 0.8; }
  .save-msg { text-align: center; padding: 10px; font-size: 14px; color: var(--green); font-weight: 500; display: none; }

  /* Growth page */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat-card { background: var(--gray-bg); border-radius: var(--radius-lg); padding: 14px; }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
  .stat-val { font-size: 22px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.5px; }
  .stat-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .pct-bar-bg { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .pct-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
  .pct-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-tertiary); margin-top: 3px; }

  .growth-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 8px; }
  .growth-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 70px; }
  .growth-group label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
  .calc-btn {
    padding: 12px 18px; background: var(--blue); color: #fff; border: none;
    border-radius: var(--radius-md); font-size: 14px; font-family: var(--font); font-weight: 600;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }

  .delete-btn {
    background: none; border: none; cursor: pointer; color: var(--text-tertiary); padding: 4px; font-size: 16px;
  }
  .delete-btn:active { color: var(--red); }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>💉 성장 호르몬 관리</h1>
  </div>

  <!-- Calendar Page -->
  <div id="page-calendar" class="page active scroll-area">
    <div class="card">
      <div class="cal-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <span class="cal-title" id="cal-title"></span>
        <button onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-grid">
        <div class="cal-dow">일</div><div class="cal-dow">월</div><div class="cal-dow">화</div>
        <div class="cal-dow">수</div><div class="cal-dow">목</div><div class="cal-dow">금</div>
        <div class="cal-dow">토</div>
      </div>
      <div class="cal-grid" id="cal-cells"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>주사</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--amber)"></div>휴약일</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>진료일</div>
      </div>
    </div>
    <div class="card" id="day-detail-card">
      <div class="sel-day-header" id="sel-day-title">날짜를 선택하세요</div>
      <div id="day-detail-content"><div class="empty-state">기록이 없어요</div></div>
    </div>
  </div>

  <!-- Inject Page -->
  <div id="page-inject" class="page scroll-area">
    <div class="card">
      <div class="card-title">날짜</div>
      <input type="date" id="inj-date" class="input-field"/>
    </div>
    <div class="card">
      <div class="card-title">주사 부위</div>
      <div class="zone-grid" id="zone-area">
        <button class="zone-btn" data-zone="복부" onclick="selectZone(this)">
          <svg width="60" height="72" viewBox="0 0 60 80">
            <ellipse cx="30" cy="36" rx="20" ry="26" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="1.5"/>
            <circle cx="30" cy="26" r="8" fill="#B5D4F4"/>
            <ellipse cx="30" cy="40" rx="9" ry="5" fill="#85B7EB" opacity="0.5"/>
            <circle id="dot-복부-L" cx="20" cy="42" r="4.5" fill="transparent" stroke="#378ADD" stroke-width="1.5"/>
            <circle id="dot-복부-R" cx="40" cy="42" r="4.5" fill="transparent" stroke="#378ADD" stroke-width="1.5"/>
          </svg>
          <span>복부</span>
        </button>
        <button class="zone-btn" data-zone="엉덩이" onclick="selectZone(this)">
          <svg width="60" height="72" viewBox="0 0 60 80">
            <path d="M10 48 Q8 20 30 18 Q52 20 50 48 Q50 64 30 66 Q10 64 10 48Z" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="1.5"/>
            <ellipse cx="20" cy="43" rx="8" ry="9" fill="#9FE1CB" opacity="0.6"/>
            <ellipse cx="40" cy="43" rx="8" ry="9" fill="#9FE1CB" opacity="0.6"/>
            <circle id="dot-엉덩이-L" cx="20" cy="43" r="4.5" fill="transparent" stroke="#1D9E75" stroke-width="1.5"/>
            <circle id="dot-엉덩이-R" cx="40" cy="43" r="4.5" fill="transparent" stroke="#1D9E75" stroke-width="1.5"/>
          </svg>
          <span>엉덩이</span>
        </button>
        <button class="zone-btn" data-zone="팔" onclick="selectZone(this)">
          <svg width="60" height="72" viewBox="0 0 60 80">
            <ellipse cx="30" cy="20" rx="15" ry="15" fill="#FAECE7" stroke="#F5C4B3" stroke-width="1.5"/>
            <rect x="20" y="33" width="20" height="26" rx="6" fill="#FAECE7" stroke="#F5C4B3" stroke-width="1.5"/>
            <ellipse cx="30" cy="22" rx="7" ry="7" fill="#F5C4B3" opacity="0.8"/>
            <circle id="dot-팔-L" cx="20" cy="24" r="4.5" fill="transparent" stroke="#D85A30" stroke-width="1.5"/>
            <circle id="dot-팔-R" cx="40" cy="24" r="4.5" fill="transparent" stroke="#D85A30" stroke-width="1.5"/>
          </svg>
          <span>팔 (삼각근)</span>
        </button>
      </div>
      <div id="side-select" style="display:none; margin-top:12px">
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;font-weight:500">좌/우 선택</div>
        <div class="side-row">
          <button class="side-btn" onclick="selectSide('L',this)">왼쪽</button>
          <button class="side-btn" onclick="selectSide('R',this)">오른쪽</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">용량</div>
      <div class="dose-row">
        <label>주사량</label>
        <input type="number" id="dose-val" class="dose-input" placeholder="0.0" step="0.1" inputmode="decimal"/>
        <span class="dose-unit">IU</span>
      </div>
    </div>
    <div class="card">
      <div class="card-title">특이사항</div>
      <div class="tag-row">
        <button class="tag-btn" id="tag-rest" onclick="toggleTag('rest')">휴약일</button>
        <button class="tag-btn" id="tag-hosp" onclick="toggleTag('hosp')">병원 진료일</button>
      </div>
    </div>
    <button class="save-btn" onclick="saveRecord()">기록 저장</button>
    <div class="save-msg" id="save-msg">✓ 저장되었습니다</div>
  </div>

  <!-- Growth Page -->
  <div id="page-growth" class="page scroll-area">
    <div class="card">
      <div class="card-title">아이 정보</div>
      <div class="growth-row">
        <div class="growth-group">
          <label>나이 (개월)</label>
          <input type="number" id="g-age" class="input-field" placeholder="예: 84" inputmode="numeric"/>
        </div>
        <div class="growth-group">
          <label>성별</label>
          <select id="g-sex" class="input-field" style="height:46px">
            <option value="M">남아</option>
            <option value="F">여아</option>
          </select>
        </div>
      </div>
      <div class="growth-row">
        <div class="growth-group">
          <label>키 (cm)</label>
          <input type="number" id="g-height" class="input-field" placeholder="115.0" step="0.1" inputmode="decimal"/>
        </div>
        <div class="growth-group">
          <label>몸무게 (kg)</label>
          <input type="number" id="g-weight" class="input-field" placeholder="20.0" step="0.1" inputmode="decimal"/>
        </div>
        <button class="calc-btn" onclick="calcGrowth()">계산</button>
      </div>
    </div>

    <div id="growth-result" style="display:none">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">키</div>
          <div class="stat-val" id="res-ht">—</div>
          <div class="stat-sub" id="res-ht-pct"></div>
          <div class="pct-bar-bg"><div class="pct-bar-fill" id="ht-bar" style="width:0%"></div></div>
          <div class="pct-labels"><span>3rd</span><span>50th</span><span>97th</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">몸무게</div>
          <div class="stat-val" id="res-wt">—</div>
          <div class="stat-sub" id="res-wt-pct"></div>
          <div class="pct-bar-bg"><div class="pct-bar-fill" id="wt-bar" style="width:0%"></div></div>
          <div class="pct-labels"><span>3rd</span><span>50th</span><span>97th</span></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">성장 기록</div>
      <div id="growth-history-list"><div class="empty-state">아직 기록이 없어요</div></div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="nav">
    <button class="nav-btn active" id="nav-calendar" onclick="showPage('calendar')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>캘린더
    </button>
    <button class="nav-btn" id="nav-inject" onclick="showPage('inject')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        <path d="M15 5l4 4-2 2-4-4z" fill="currentColor" stroke="none" opacity="0"/>
        <path d="M18 3l3 3-9 9-3 1 1-3z"/>
        <line x1="15" y1="6" x2="18" y2="9"/>
      </svg>기록 입력
    </button>
    <button class="nav-btn" id="nav-growth" onclick="showPage('growth')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
        <polyline points="16 7 22 7 22 13"/>
      </svg>성장 기록
    </button>
  </nav>
</div>

<script>
let records = JSON.parse(localStorage.getItem('ghRecords')||'[]');
let growthLogs = JSON.parse(localStorage.getItem('ghGrowth')||'[]');
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let selectedZone = '', selectedSide = '';
let tagRest = false, tagHosp = false;

function persist() {
  localStorage.setItem('ghRecords', JSON.stringify(records));
  localStorage.setItem('ghGrowth', JSON.stringify(growthLogs));
}

function showPage(p) {
  document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(e => e.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.getElementById('nav-'+p).classList.add('active');
  if(p==='calendar') renderCalendar();
  if(p==='growth') renderGrowthHistory();
  if(p==='inject') {
    document.getElementById('inj-date').value = new Date().toISOString().split('T')[0];
  }
}

function changeMonth(d) {
  currentMonth += d;
  if(currentMonth > 11) { currentMonth = 0; currentYear++; }
  if(currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderCalendar();
}

function renderCalendar() {
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('cal-title').textContent = currentYear + '년 ' + months[currentMonth];
  const cells = document.getElementById('cal-cells');
  cells.innerHTML = '';
  const first = new Date(currentYear, currentMonth, 1).getDay();
  const dim = new Date(currentYear, currentMonth+1, 0).getDate();
  const prevDays = new Date(currentYear, currentMonth, 0).getDate();
  const today = new Date();

  for(let i=0; i<first; i++) {
    const d = document.createElement('button');
    d.className = 'cal-day other-month';
    d.innerHTML = `<span class="day-num">${prevDays - first + 1 + i}</span>`;
    cells.appendChild(d);
  }
  for(let day=1; day<=dim; day++) {
    const ds = currentYear+'-'+String(currentMonth+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const recs = records.filter(r => r.date === ds);
    const isToday = today.getFullYear()===currentYear && today.getMonth()===currentMonth && today.getDate()===day;
    const d = document.createElement('button');
    d.className = 'cal-day' + (isToday ? ' today' : '');
    let dots = '';
    if(recs.some(r=>r.type==='inject')) dots += '<div class="dot dot-inj"></div>';
    if(recs.some(r=>r.type==='rest')) dots += '<div class="dot dot-rest"></div>';
    if(recs.some(r=>r.type==='hosp')) dots += '<div class="dot dot-hosp"></div>';
    d.innerHTML = `<span class="day-num">${day}</span><div class="dot-row">${dots}</div>`;
    d.onclick = () => showDayDetail(ds, day);
    cells.appendChild(d);
  }
  const rem = (7 - ((first+dim)%7)) % 7;
  for(let i=1; i<=rem; i++) {
    const d = document.createElement('button');
    d.className = 'cal-day other-month';
    d.innerHTML = `<span class="day-num">${i}</span>`;
    cells.appendChild(d);
  }
}

function showDayDetail(ds, day) {
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('sel-day-title').textContent = currentYear+'년 '+months[currentMonth]+' '+day+'일';
  const recs = records.filter(r => r.date === ds);
  const content = document.getElementById('day-detail-content');
  if(recs.length === 0) { content.innerHTML = '<div class="empty-state">기록이 없어요</div>'; return; }
  content.innerHTML = '<div class="history-list">' + recs.map((r,i) => {
    let badge = '', detail = '';
    if(r.type==='inject') { badge = '<span class="history-badge badge-inj">주사</span>'; detail = `${r.zone} ${r.side==='L'?'왼쪽':'오른쪽'} · ${r.dose} IU`; }
    else if(r.type==='rest') { badge = '<span class="history-badge badge-rest">휴약일</span>'; detail = ''; }
    else if(r.type==='hosp') { badge = '<span class="history-badge badge-hosp">진료일</span>'; detail = ''; }
    return `<div class="history-item">${badge}<span class="history-detail">${detail}</span><button class="delete-btn" onclick="deleteRecord('${ds}',${i})">✕</button></div>`;
  }).join('') + '</div>';
}

function deleteRecord(ds, idx) {
  const recs = records.filter(r => r.date === ds);
  const target = recs[idx];
  const globalIdx = records.findIndex(r => r === target);
  if(globalIdx > -1) { records.splice(globalIdx, 1); persist(); renderCalendar(); showDayDetail(ds, parseInt(ds.split('-')[2])); }
}

function selectZone(btn) {
  document.querySelectorAll('.zone-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedZone = btn.dataset.zone;
  selectedSide = '';
  document.getElementById('side-select').style.display = 'block';
  document.querySelectorAll('.side-btn').forEach(b => b.classList.remove('active'));
  updateDots();
}

function selectSide(s, btn) {
  selectedSide = s;
  document.querySelectorAll('.side-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateDots();
}

function updateDots() {
  ['복부','엉덩이','팔'].forEach(z => {
    ['L','R'].forEach(s => {
      const el = document.getElementById('dot-'+z+'-'+s);
      if(el) el.setAttribute('fill', (selectedZone===z && selectedSide===s) ? (z==='복부'?'#378ADD':z==='엉덩이'?'#1D9E75':'#D85A30') : 'transparent');
    });
  });
}

function toggleTag(t) {
  if(t==='rest') { tagRest=!tagRest; document.getElementById('tag-rest').className='tag-btn'+(tagRest?' active-rest':''); }
  if(t==='hosp') { tagHosp=!tagHosp; document.getElementById('tag-hosp').className='tag-btn'+(tagHosp?' active-hosp':''); }
}

function saveRecord() {
  const date = document.getElementById('inj-date').value;
  if(!date) { alert('날짜를 선택해주세요'); return; }
  let saved = false;
  if(tagRest) { records.push({date, type:'rest'}); saved = true; }
  if(tagHosp) { records.push({date, type:'hosp'}); saved = true; }
  if(selectedZone && selectedSide) {
    const dose = parseFloat(document.getElementById('dose-val').value) || 0;
    records.push({date, type:'inject', zone:selectedZone, side:selectedSide, dose});
    saved = true;
  }
  if(!saved) { alert('주사 부위를 선택하거나 휴약일/진료일을 표시해주세요'); return; }
  persist();
  const msg = document.getElementById('save-msg');
  msg.style.display = 'block';
  setTimeout(() => msg.style.display = 'none', 2000);
  selectedZone = ''; selectedSide = ''; tagRest = false; tagHosp = false;
  document.querySelectorAll('.zone-btn').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.side-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tag-btn').forEach(b => b.className = 'tag-btn');
  document.getElementById('dose-val').value = '';
  document.getElementById('side-select').style.display = 'none';
  updateDots();
}

function pct(val, p3, p50, p97) {
  if(val <= p3) return Math.max(1, 3 * val / p3);
  if(val <= p50) return 3 + (val-p3)/(p50-p3)*47;
  if(val <= p97) return 50 + (val-p50)/(p97-p50)*47;
  return Math.min(99, 97 + (val-p97)/p97*2);
}

function calcGrowth() {
  const age = parseInt(document.getElementById('g-age').value);
  const sex = document.getElementById('g-sex').value;
  const ht = parseFloat(document.getElementById('g-height').value);
  const wt = parseFloat(document.getElementById('g-weight').value);
  if(!age || isNaN(ht) || isNaN(wt)) { alert('나이, 키, 몸무게를 모두 입력해주세요'); return; }
  const idx = Math.min(age, 60);
  const gd = KOR[sex];
  const htP = pct(ht, gd.ht.p3[idx], gd.ht.p50[idx], gd.ht.p97[idx]);
  const wtP = pct(wt, gd.wt.p3[idx], gd.wt.p50[idx], gd.wt.p97[idx]);
  document.getElementById('res-ht').textContent = ht.toFixed(1) + ' cm';
  document.getElementById('res-wt').textContent = wt.toFixed(1) + ' kg';
  document.getElementById('res-ht-pct').textContent = Math.round(htP) + '번째 백분위';
  document.getElementById('res-wt-pct').textContent = Math.round(wtP) + '번째 백분위';
  const htColor = htP < 10 ? '#E24B4A' : htP < 25 ? '#EF9F27' : '#185FA5';
  const wtColor = wtP < 10 ? '#E24B4A' : wtP < 25 ? '#EF9F27' : '#185FA5';
  const toBar = p => Math.max(2, Math.min(100, (p-3)/94*100));
  document.getElementById('ht-bar').style.width = toBar(htP) + '%';
  document.getElementById('ht-bar').style.background = htColor;
  document.getElementById('wt-bar').style.width = toBar(wtP) + '%';
  document.getElementById('wt-bar').style.background = wtColor;
  document.getElementById('growth-result').style.display = 'block';
  growthLogs.push({ date: new Date().toISOString().split('T')[0], age, sex, ht, wt, htP: Math.round(htP), wtP: Math.round(wtP) });
  persist();
  renderGrowthHistory();
}

function renderGrowthHistory() {
  const el = document.getElementById('growth-history-list');
  if(!el) return;
  if(growthLogs.length === 0) { el.innerHTML = '<div class="empty-state">아직 기록이 없어요</div>'; return; }
  el.innerHTML = '<div class="history-list">' + [...growthLogs].reverse().slice(0,20).map((l,i) =>
    `<div class="history-item">
      <span class="history-detail"><strong>${l.date}</strong> · ${l.age}개월 · 키 ${l.ht}cm (${l.htP}th) · ${l.wt}kg (${l.wtP}th)</span>
      <button class="delete-btn" onclick="deleteGrowth(${growthLogs.length-1-i})">✕</button>
    </div>`
  ).join('') + '</div>';
}

function deleteGrowth(idx) {
  growthLogs.splice(idx, 1); persist(); renderGrowthHistory();
}

renderCalendar();
renderGrowthHistory();
document.getElementById('inj-date').value = new Date().toISOString().split('T')[0];
</script>
